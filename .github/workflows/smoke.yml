name: CI

on:
  push:
    branches: [master, main, pyside]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Qt runtime system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff pytest-timeout

      - name: Prepare test workspace
        run: python -c "import os; os.makedirs('workspace/PcodeProjects/Projects', exist_ok=True)"

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (pytest)
        run: pytest -m "not slow and not smoke"

      - name: Smoke tests (pytest)
        run: pytest tests/test_smoke.py -m "not slow" --timeout=300

  test-windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff pytest-timeout

      - name: Prepare test workspace
        run: python -c "import os; os.makedirs('workspace/PcodeProjects/Projects', exist_ok=True)"

      - name: Lint (ruff)
        run: ruff check .

      - name: Unit tests (pytest)
        run: pytest -m "not slow and not smoke"

      - name: Smoke tests (pytest)
        run: pytest tests/test_smoke.py -m "not slow" --timeout=300

  freeze-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PCODE_SKIP_BUILD: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Qt runtime system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout

      - name: Build freeze smoke (slow)
        run: pytest tests/test_smoke.py -m slow

  freeze-smoke-windows:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PCODE_SKIP_BUILD: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout

      - name: Build freeze smoke (slow, Windows)
        run: pytest tests/test_smoke.py -m slow

  freeze-ide-windows:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "debugpy>=1.8"

      - name: Freeze IDE (zip + MSI)
        run: python scripts/freeze_ide.py

      - name: Upload Windows IDE artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pcode-windows-x64
          path: |
            dist/Pcode-*-windows-x64.zip
            dist/Pcode-*-windows-x64.msi
          if-no-files-found: error
          retention-days: 14
